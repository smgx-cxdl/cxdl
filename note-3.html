                <h2>1984</h2>
                <div class="note-text">
                    <p>1、「老大哥在看著你」</p>
                    <p>2、“但话又说回来，一个自孩提开始就受严格思想训练的人，在新语所说“罪停”“黑白”和“双重思想”范围打转的人，长大后就不会愿意也不可能把任何问题深思熟虑了。”</p>
                    <p>3、在大洋邦盛行的哲学叫英社，在欧亚国盛行的哲学被称为新布尔什维克主义，而在东亚国盛行的哲学有个中文名字，通常译作“死亡崇拜”，但相信翻译成“消灭自我”更为贴切。</p>
