<h2>摘录</h2>
<div class="note-text gap1">
<p>1、「 G·K·切斯特顿天才般地预言了二十世纪即将发生的一切：一个充满谋杀、种族灭绝和流血的世纪，一个人类尊严遭到践踏、现代性盛行、进步主义盛行的世纪，一个左右两翼都充斥着邪恶的世纪。</p>
<p>与阿尔弗雷德大帝对抗异教徒（至少他们还是人）不同，我们对抗的是阴影、官僚和精神病患者，而这些人到了2026年却都占据着权力要职。</p>
<p>正如拉塞尔柯克所说：“每个时代都饱受暴力和欺诈之苦，抱怨自身的苦难；但如果我们研读历史，就会发现人类的冒险历程是一部灾难编年史。在每个时代，社会的解脱都源于少数受上帝恩典感召之人的努力。” 」</p>
