                <h2>王怡文库</h2>
                <div class="note-text">
                    <p>1、最近这半年的时间，前后有几位会友问我关于门徒训练的事。我们教会之前做过个人门训的计划，但实际上没有推行下去。我们当时提出：“为一个人流泪，陪一个人成长，带一个人归主”。但是我不知道在这间教会，有多少弟兄姐妹自己仍然在做个人传福音的工作、门训的工作。在2016年，你为谁流泪？陪哪个人成长？带了哪个人归主？我说，我们很亏欠，我自己的服事也很亏欠，我们没有将个人的门训在这间教会中推行下来。有很多的弟兄姐妹，已经有好些年没有带过一个慕道的朋友来教会，也没有向人分享过他信主的见证和耶稣基督的福音，没有为主收割庄稼。</p>
                </div>
