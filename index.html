<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人小站</title>
    <style>
        body { 
            text-align: center; 
            padding-top: 100px; 
            font-family: sans-serif; 
            background: #f4f4f9; 
        }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>
    <h1>Hello, World! </h1>

【圣经·传道书12章1节】
你趁着年幼，衰败的日子尚未来到，就是你所说，我毫无喜乐的那些年日未曾临近之先，当记念造你的主。
    <p>陌生人，你好！</p>
<img src="field-5429112_640.jpg" alt="风景图片">
<p>无论怎么看，都是无聊的一生。</p>
<p>生れて、すみません。</p>
<p>Matrix</p>
<p>オレの中には小さい頃のオレがいて、今も毎日泣いている</p>
<p>我心裡有個小時候的我，至今每天都在哭泣。</p>
<img src="qwe.jpg" alt="星空草地" style="max-width: 100%; height: auto; border-radius: 8px;">
<p>安らぎを君に</p>
<p>命运迷人之处，在于意想不到的转折。</p>
<script>
  const API = "https://kvdb.io/A2k8v9xPqLm3nR7tYwZ1/cxdl_board";
  // 这里可以改成你自己的站长管理暗号（比如 888888）
  const ADMIN_CODE = "admin123";

  let myIds = JSON.parse(localStorage.getItem("cxdl_my_msgs") || "[]");
  let isAdmin = localStorage.getItem("cxdl_is_admin") === "1";

  // 显示留言列表
  function showList(list) {
    const box = document.getElementById("msg-list");
    box.innerHTML = "";
    list.forEach((item) => {
      const row = document.createElement("div");
      row.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #fff; border: 1px solid #eee; border-radius: 3px; font-size: 13px;";
      
      const text = document.createElement("span");
      text.textContent = item.text;
      text.style.wordBreak = "break-all";
      row.appendChild(text);

      // 如果是站长管理模式，或者这条是自己发的，就显示“删除”按钮
      if (isAdmin || myIds.includes(item.id)) {
        const delBtn = document.createElement("button");
        delBtn.textContent = "删除";
        delBtn.style.cssText = "margin-left: 10px; padding: 2px 6px; font-size: 11px; color: #999; background: none; border: 1px solid #eee; border-radius: 2px; cursor: pointer; flex-shrink: 0;";
        delBtn.onclick = () => deleteMsg(item.id);
        row.appendChild(delBtn);
      }

      box.appendChild(row);
    });
  }

  // 读取留言
  async function loadMsgs() {
    try {
      const res = await fetch(API);
      if (res.ok) {
        const data = await res.json();
        showList(data);
      }
    } catch (e) {}
  }

  // 发送留言（含暗号识别）
  async function addMsg() {
    const input = document.getElementById("msg-input");
    const btn = document.getElementById("msg-btn");
    const val = input.value.trim();
    if (!val) return;

    // 如果输入的是站长暗号，则切换管理模式，不发出留言
    if (val === ADMIN_CODE) {
      isAdmin = !isAdmin;
      localStorage.setItem("cxdl_is_admin", isAdmin ? "1" : "0");
      input.value = "";
      alert(isAdmin ? "已开启站长模式，可删除所有留言" : "已退出站长模式");
      loadMsgs();
      return;
    }

    btn.disabled = true;
    btn.textContent = "...";

    try {
      let list = [];
      const res = await fetch(API);
      if (res.ok) list = await res.json();
      
      const msgId = Date.now() + "_" + Math.random().toString(36).slice(2, 6);
      myIds.push(msgId);
      localStorage.setItem("cxdl_my_msgs", JSON.stringify(myIds));

      list.unshift({ id: msgId, text: val });
      list = list.slice(0, 50);

      await fetch(API, { method: "POST", body: JSON.stringify(list) });
      input.value = "";
      showList(list);
    } catch (e) {
      alert("发送失败，请检查网络");
    } finally {
      btn.disabled = false;
      btn.textContent = "发送";
    }
  }

  // 删除留言
  async function deleteMsg(id) {
    try {
      const res = await fetch(API);
      if (!res.ok) return;
      let list = await res.json();
      list = list.filter(item => item.id !== id);
      await fetch(API, { method: "POST", body: JSON.stringify(list) });
      showList(list);
    } catch (e) {}
  }

  loadMsgs();
</script>
</body>
</html>
