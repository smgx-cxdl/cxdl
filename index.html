<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">
    <!-- ★★★ 名称设置：网站里会重复出现的名字都在这里，想改名只改引号里的字，其它地方自动跟着变 ★★★ -->
    <script>
        const NAMES = {
            site:      '昔日今日',      // 网站名（浏览器标签页 + 顶部栏标题）
            home:      '主页',          // 菜单：主页
            other:     '圣经经文',      // 菜单：圣经经文
            bible:     '圣经软件下载',  // 菜单：圣经软件下载
            notes:     '随读笔记',      // 菜单 + 笔记列表页标题
            collect:   '镜鉴',          // 菜单 + 入口页标题 + “← 返回镜鉴”
            fragments: '零言',          // 入口页里的“零言”
            essays:    '篇章'           // 入口页里的“篇章” + 篇章页标题
        };
        document.title = NAMES.site;
    </script>
    <style>
        /* ===== 整体 ===== */
        body { text-align: center; padding: 0; margin: 0; font-family: sans-serif; background: #f4f4f9; overflow: hidden; }
        #scroller {
            position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
            overflow-y: scroll; overflow-x: hidden; -webkit-overflow-scrolling: touch;
            box-sizing: border-box; padding: 24px 16px 60px;
            scrollbar-width: none;
        }
        #scroller::-webkit-scrollbar { display: none; }
        @media (max-width: 600px) { #scroller { padding-top: 16px; } }

        /* ===== 文字、链接、图片 ===== */
        h1, h2 { color: #333; }
        p { color: #666; }
        .verse { color: #000; line-height: 1.8; }
        main a { color: #4a7bd0; text-decoration: none; border-bottom: 1px dashed #4a7bd0; }
        img { max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 8px; }
        figure { margin: 0 auto; }
        figcaption {
            margin: 8px 0 4px; font-size: 17px; letter-spacing: 1px; color: #444;
            font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "BiauKai", "DFKai-SB", serif;
        }

        /* ===== 页面切换 ===== */
        .page { display: none; }
        .page.active { display: block; }

        /* ===== 顶部栏 ===== */
        #topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 52px;
            display: flex; align-items: center; gap: 8px; padding: 0 10px;
            background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); z-index: 100;
        }
        .iconbtn {
            width: 40px; height: 40px; padding: 0; border: none; border-radius: 8px;
            background: #eee; color: #333; font-size: 20px; line-height: 40px;
            text-align: center; text-decoration: none; cursor: pointer;
        }
        #homeBtn { font-size: 14px; }
        #topTitle { flex: 1; text-align: left; color: #333; font-size: 16px; }
        #searchBtn { filter: grayscale(1); opacity: .65; }

        /* ===== 侧边菜单 ===== */
        #overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); display: none; z-index: 300; }
        #overlay.open { display: block; }
        #menu {
            position: fixed; top: 0; bottom: 0; left: 0; width: 70%; max-width: 260px;
            background: #fff; transform: translateX(-100%); transition: transform .25s ease;
            z-index: 400; text-align: left; padding: 16px 0; box-shadow: 2px 0 8px rgba(0, 0, 0, .2);
        }
        #menu.open { transform: translateX(0); }
        #menu .menuhead { padding: 4px 20px 12px; color: #999; font-size: 13px; }
        #menu a { display: block; padding: 14px 20px; color: #333; text-decoration: none; font-size: 17px; border-bottom: none; }
        #menu a.current { background: #f0f0f7; font-weight: bold; }

        /* ===== 回到顶部 ===== */
        #toTop {
            position: fixed; right: 16px; bottom: 24px; width: 44px; height: 44px; padding: 0;
            line-height: 44px; text-align: center; border: none; border-radius: 50%;
            background: rgba(0, 0, 0, .55); color: #fff; font-size: 20px; cursor: pointer; display: none; z-index: 90;
        }

        /* ===== 搜索栏与高亮 ===== */
        #searchBar {
            position: fixed; top: 0; left: 0; right: 0; height: 52px; box-sizing: border-box;
            display: none; align-items: center; gap: 6px; padding: 0 10px;
            background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .2); z-index: 200;
        }
        #searchBar.open { display: flex; }
        #q { flex: 1; min-width: 0; height: 36px; padding: 0 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        #count { font-size: 13px; color: #666; white-space: nowrap; }
        #searchBar button { width: 36px; height: 36px; border: none; border-radius: 6px; background: #eee; font-size: 16px; cursor: pointer; }
        mark.hit { background: #ffe58a; color: inherit; border-radius: 2px; }
        mark.hit.current { background: #ff9f43; }

        /* ===== 列表卡片（随读笔记 / 篇章） ===== */
        .note-item {
            display: block; background: #fff; border-radius: 8px; margin: 12px auto; max-width: 640px;
            padding: 14px 16px; text-align: left; text-decoration: none; color: #333;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .1); border-bottom: none !important;
        }
        .note-item .nt { display: block; font-size: 17px; font-weight: bold; }
        .note-item .ns { display: block; margin-top: 6px; font-size: 14px; color: #777; line-height: 1.6; }
        .note-empty { color: #888; margin-top: 24px; text-align: center; }
        .backlink {
            display: block; max-width: 640px; margin: 0 auto 8px; padding: 6px 0;
            text-align: left; font-size: 15px; color: #555; text-decoration: none; border-bottom: none;
        }

        /* ===== 正文页（笔记 / 篇章 / 零言） ===== */
        .note-page .note-text, .essay-page .note-text, .frag-page .note-text { max-width: 640px; margin: 0 auto; text-align: left; line-height: 1.9; }
        .note-page .note-text p, .essay-page .note-text p, .frag-page .note-text p { color: #222; }
        .essay-page .note-text p { text-indent: 2em; }

        /* ===== 收录条目：原文 / 译 / 释（标签由 CSS 生成，不影响搜索与列表摘要） ===== */
        .clip { margin: 0 0 14px; padding: 0 0 12px; border-bottom: 1px dashed #d4d4de; }
        .clip:last-child { border-bottom: none; }
        .clip .orig {
            border-left: 3px solid #bbb; padding: 0 0 0 10px; font-weight: bold; font-size: 16px;
            font-family: Georgia, "Times New Roman", serif; line-height: 1.55; color: #1a1a1a;
        }
        .clip .no { color: #999; margin-right: 6px; }
        .clip .tr { margin-top: 6px; font-size: 15px; line-height: 1.7; color: #222; }
        .clip .tr::before, .clip .ex summary::before {
            display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 4px;
            background: #aaa; color: #fff; font-size: 12px; line-height: 18px; vertical-align: 1px; font-weight: normal;
        }
        .clip .tr::before { content: '译'; }
        .clip .ex { margin-top: 6px; }
        .clip .ex summary { list-style: none; cursor: pointer; display: inline-block; color: #999; font-size: 12px; -webkit-tap-highlight-color: transparent; }
        .clip .ex summary::-webkit-details-marker { display: none; }
        .clip .ex summary::before { content: '释'; margin-right: 0; }
        .clip .ex summary::after { content: ' ▾'; }
        .clip .ex[open] summary::after { content: ' ▴'; }
        .clip .ex-body { margin-top: 6px; font-size: 14px; line-height: 1.75; color: #555; }
        .clip .src { margin-top: 6px; font-size: 13px; color: #999; text-align: right; }

        /* ===== 可拖动滚动条（手机系统滚动条无法拖动，所以自己做） ===== */
        #sbTrack { position: fixed; top: 52px; right: 0; bottom: 0; width: 22px; z-index: 80; touch-action: none; display: none; }
        #sbThumb { position: absolute; top: 0; right: 3px; width: 6px; border-radius: 3px; background: rgba(90, 90, 110, .55); touch-action: none; cursor: pointer; transition: width .15s, background .15s; }
        #sbThumb::before { content: ''; position: absolute; top: 0; bottom: 0; left: -14px; right: -3px; }
        #sbThumb.drag { width: 10px; background: rgba(60, 60, 80, .8); }

        /* ===== 圣经经文排版 ===== */
        .vs { display: flex; align-items: flex-start; max-width: 640px; margin: 18px auto; text-align: left; line-height: 1.8; color: #666; }
        .vn { flex: none; white-space: nowrap; }
        .vb { flex: 1; min-width: 0; }
        .vb strong { color: #333; }

        /* ===== 段落间距（任意页面可加 class）：gap0 最紧，gap3 最松 ===== */
        .gap0 p { margin: 0 !important; }
        .gap1 p { margin: 0.3em 0 !important; }
        .gap2 p { margin: 0.6em 0 !important; }
        .gap3 p { margin: 1.5em 0 !important; }
    </style>
</head>
<body>
    <div id="topbar">
        <button class="iconbtn" id="menuBtn" aria-label="菜单">☰</button>
        <a class="iconbtn" id="homeBtn" href="#home" aria-label="主页">首页</a>
        <span id="topTitle" data-name="site"></span>
        <button class="iconbtn" id="searchBtn" aria-label="搜索">🔍</button>
    </div>
    <div id="searchBar">
        <input id="q" type="search" placeholder="输入文字，回车跳转" autocomplete="off">
        <span id="count"></span>
        <button id="prev" aria-label="上一个">↑</button>
        <button id="next" aria-label="下一个">↓</button>
        <button id="closeBar" aria-label="关闭">✕</button>
    </div>
    <div id="overlay"></div>
    <nav id="menu">
        <div class="menuhead">菜单</div>
        <a href="#home" data-page="home" data-name="home"></a>
        <a href="#other" data-page="other" data-name="other"></a>
        <a href="#bible" data-page="bible" data-name="bible"></a>
        <a href="#notes" data-page="notes" data-name="notes"></a>
        <a href="#collect" data-page="collect" data-name="collect"></a>
    </nav>
    <div id="scroller">
        <main>
            <!-- ========== 板块一：主页（首页） ========== -->
            <section class="page active" id="page-home">
                <h1>Hello, World!</h1>

                <figure>

                <p>安らぎを君に</p>
                <!-- 底部联系我模块 -->
                <hr style="border: none; border-top: 1px solid #e0e0e8; max-width: 200px; margin: 36px auto;">
                <p style="font-size: 14px; line-height: 1.8;">

                    smgxcxdl@163.com

            <!-- ========== 板块二：圣经经文 ========== -->

            <!-- ========== 板块三：圣经软件下载 ========== -->
            <section class="page" id="page-bible">
                <h2>圣经</h2>
                <p>浏览器打开下面的网站下载安装：</p>

            <section class="page" id="page-notes">
                <h2 data-name="notes"></h2>
                <div id="noteList"></div>
            </section>
            <!-- ========== 板块四·笔记内容（下面每个 note-page 是一篇笔记，新增笔记复制一段即可，id 依次递增） ========== -->
            <div id="slot-notes"></div>

            <!-- ========== 板块五：镜鉴（入口页，两个部分：零言 / 篇章） ========== -->
            <section class="page" id="page-collect">
                <h2 data-name="collect"></h2>
                <a class="note-item" href="#fragments"><span class="nt" data-name="fragments"></span></a>
                <a class="note-item" href="#essays"><span class="nt" data-name="essays"></span></a>
            </section>
            <!-- ========== 镜鉴·零言（句子、段落，风格同“阅读切片”；新增一条复制一行 p，序号依次递增） ========== -->
            <div id="slot-fragments"></div>
            <!-- ========== 镜鉴·篇章（文章列表，列表由脚本根据下面的 essay-page 自动生成） ========== -->
            <section class="page" id="page-essays">
                <a class="backlink" href="#collect">← 返回<span data-name="collect"></span></a>
                <h2 data-name="essays"></h2>
                <div id="essayList"></div>
            </section>
            <!-- ========== 镜鉴·篇章·文章内容（新增文章：复制下面整个 essay-page 段，id 依次递增 essay-2、essay-3…，改 data-title、标题和正文） ========== -->
            <div id="slot-essays"></div>
        </main>
    </div>
    <div id="sbTrack"><div id="sbThumb"></div></div>
    <button id="toTop" aria-label="回到顶部">↑</button>
    <script>
        (async function () {
            const SITE_NAME = NAMES.site;
            /* 把文件顶部 NAMES 里的名字填到所有带 data-name 的位置（内容文件里也可以用 <span data-name="collect"></span>） */
            function applyNames() {
                document.querySelectorAll('[data-name]').forEach(el => { el.textContent = NAMES[el.dataset.name] || ''; });
            }
            applyNames();

            /* ===== 加载 manifest.json 里列出的内容文件 ===== */
            async function loadContent() {
                let manifest;
                try {
                    const r = await fetch('manifest.json', { cache: 'no-cache' });
                    if (!r.ok) throw new Error(r.status);
                    manifest = await r.json();
                } catch (err) {
                    document.getElementById('page-home').insertAdjacentHTML('afterbegin',
                        '<p style="color:#c33">内容加载失败，请通过网址访问（不要直接双击打开文件）。</p>');
                    return;
                }
                await Promise.all(Object.keys(manifest).map(async name => {
                    const slot = document.getElementById('slot-' + name);
                    if (!slot) return;
                    const texts = await Promise.all([].concat(manifest[name]).map(f =>
                        fetch(f, { cache: 'no-cache' })
                            .then(r => r.ok ? r.text() : Promise.reject(f))
                            .catch(() => '<!-- 加载失败：' + f + ' -->')));
                    slot.innerHTML = texts.join('\n');
                }));
            }
            await loadContent();

            applyNames();   // 内容文件载入后再填一次

            /* ===== 侧边菜单 ===== */
            const scroller = document.getElementById('scroller');
            const menu = document.getElementById('menu');
            const overlay = document.getElementById('overlay');
            const topTitle = document.getElementById('topTitle');
            const toTop = document.getElementById('toTop');
            function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
            function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
            document.getElementById('menuBtn').addEventListener('click', openMenu);
            overlay.addEventListener('click', closeMenu);
            menu.addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });

            /* ===== 列表自动生成（笔记 / 篇章） ===== */
            function buildList(pageSelector, listId, emptyText, noTitle) {
                const list = document.getElementById(listId);
                const pages = document.querySelectorAll(pageSelector);
                if (!pages.length) { list.innerHTML = '<p class="note-empty">' + emptyText + '</p>'; return; }
                pages.forEach(sec => {
                    const title = sec.getAttribute('data-title') || sec.querySelector('h2')?.textContent || noTitle;
                    const snippet = (sec.querySelector('.note-text')?.textContent.trim().slice(0, 60) || '') + '...';
                    const a = document.createElement('a');
                    a.className = 'note-item';
                    a.href = '#' + sec.id.replace('page-', '');
                    a.innerHTML = `<span class="nt">${title}</span><span class="ns">${snippet}</span>`;
                    list.appendChild(a);
                });
            }
            buildList('.note-page', 'noteList', '暂无笔记', '未命名笔记');
            buildList('.essay-page', 'essayList', '暂无文章', '未命名文章');

            /* ===== 页面切换（根据网址 # 显示对应板块） ===== */
            let prevHash = '', notesScroll = 0, essaysScroll = 0;
            function showPage() {
                const hash = location.hash.replace('#', '') || 'home';
                if (prevHash === 'notes') notesScroll = scroller.scrollTop;
                if (prevHash === 'essays') essaysScroll = scroller.scrollTop;
                let matched = false;
                document.querySelectorAll('.page').forEach(p => {
                    const on = p.id === 'page-' + hash;
                    p.classList.toggle('active', on);
                    if (on) matched = true;
                });
                if (!matched) document.getElementById('page-home').classList.add('active');
                const inCollect = hash === 'essays' || hash === 'fragments' || hash.startsWith('essay-');
                let titleText = SITE_NAME;
                menu.querySelectorAll('a').forEach(a => {
                    const page = a.getAttribute('data-page');
                    const isCurrent = page === hash
                        || (hash.startsWith('note-') && page === 'notes')
                        || (inCollect && page === 'collect');
                    a.classList.toggle('current', isCurrent);
                    if (isCurrent) titleText = a.textContent;
                });
                if (hash === 'home') titleText = SITE_NAME;
                topTitle.textContent = titleText;
                scroller.scrollTop = (hash === 'notes' && prevHash.startsWith('note-')) ? notesScroll
                    : (hash === 'essays' && prevHash.startsWith('essay-')) ? essaysScroll : 0;
                prevHash = hash;
                closeMenu();
                if (!jumping) { clearMarks(); hits = []; cur = -1; updateCount(); }   // 切换页面时清除搜索高亮
            }

            /* ===== 搜索 ===== */
            const searchBar = document.getElementById('searchBar');
            const q = document.getElementById('q');
            const countEl = document.getElementById('count');
            let hits = [], cur = -1, jumping = false;

            function clearMarks() {
                scroller.querySelectorAll('mark.hit').forEach(m => {
                    const parent = m.parentNode;
                    parent.replaceChild(document.createTextNode(m.textContent), m);
                    parent.normalize();
                });
            }
            function updateCount() {
                if (!q.value.trim()) countEl.textContent = '';
                else if (hits.length === 0) countEl.textContent = '无结果';
                else countEl.textContent = (cur + 1) + '/' + hits.length;
            }
            function buildHits(keyword) {
                clearMarks();
                hits = []; cur = -1;
                if (!keyword) { updateCount(); return; }
                const kw = keyword.toLowerCase();
                const walker = document.createTreeWalker(scroller.querySelector('main'), NodeFilter.SHOW_TEXT, {
                    acceptNode(node) {
                        if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
                        if (node.parentNode.closest('#noteList, #essayList, script, style')) return NodeFilter.FILTER_REJECT;
                        return NodeFilter.FILTER_ACCEPT;
                    }
