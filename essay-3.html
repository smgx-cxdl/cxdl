                <h2>網路碎片II</h2>
                <div class="note-text">
                    <!-- 新增一条：复制下面整个 clip 块。没有译或释就删掉对应那一行；不需要来源就删掉 src 行 -->
                    <div class="clip">
                        <div class="orig"><span class="no">1、</span>Civilization is a competition to see who can become the most evil person in history.</div>
                        <div class="tr">文明是一场竞赛，看谁能成为历史上最邪恶的人。</div>
                        <details class="ex">
                            <summary aria-label="展开释"></summary>
                            <div class="ex-body">随着文明和科技的发展，人类行善的能力在增强，但作恶的效率也在呈指数级上升。冷兵器时代一个暴君能伤害的人数有限，而现代工业、核武器、信息监控和金融体系，让极少数掌权者拥有了毁灭整个人类或精准控制亿万人的能力。每一代新的“恶人”都在借助更先进的文明工具，不断刷新历史灾难的规模纪录。</div>
                        </details>
